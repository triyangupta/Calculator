<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <input type="text" class="input-screen" readonly>

    <div class="number">
      <div id="ac">AC</div>
      <div id="arrow">&#8592;</div>
      <div class="counting">%</div>
      <div class="counting">/</div>
      <div class="counting">7</div>
      <div class="counting">8</div>
      <div class="counting">9</div>
      <div class="counting">*</div>
      <div class="counting">4</div>
      <div class="counting">5</div>
      <div class="counting">6</div>
      <div class="counting">-</div>
      <div class="counting">1</div>
      <div class="counting">2</div>
      <div class="counting">3</div>
      <div class="counting">+</div>
      <div class="counting">00</div>
      <div class="counting">0</div>
      <div class="counting">.</div>
      <div id="equal">=</div>
    </div>
  </div>
<script src="script.js"></script>
</body>

</html>
